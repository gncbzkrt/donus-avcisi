<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dönüş Avcısı · TradingView</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0e14;overflow:hidden}.tradingview-widget-container{width:100%;height:100%}.tradingview-widget-container__widget{width:100%;height:100%}</style></head><body>
<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div>
<script>
(function(){
  const q=new URLSearchParams(location.search).get('tvwidgetsymbol')||'';
  const symbol=q.startsWith('BIST:')?q:'BIST:'+q.replace(/^.*:/,'');
  const cfg={autosize:true,symbol:symbol,interval:'D',timezone:'exchange',theme:'dark',style:'1',withdateranges:true,hide_side_toolbar:false,allow_symbol_change:false,save_image:false,calendar:false,details:false,hotlist:false,show_popup_button:true,locale:'tr',support_host:'https://www.tradingview.com',studies:['RSI@tv-basicstudies','MACD@tv-basicstudies','MASimple@tv-basicstudies']};
  const s=document.createElement('script');
  s.type='text/javascript'; s.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js'; s.async=true;
  s.textContent=JSON.stringify(cfg);
  document.querySelector('.tradingview-widget-container').appendChild(s);
})();
</script>
</body></html>
